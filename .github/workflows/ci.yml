# The quality gate. Every push and every pull request runs both
# suites: the api's checks against the built foundation, and the full
# browser journey through the product. A red run here is the truth
# about the branch; nothing merges on hope.
name: The suites

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci --workspaces --include-workspace-root
      - name: The api suite
        run: npm test --workspace api
      - name: A Chromium for the journey
        run: |
          npx --yes playwright@1.62.1 install --with-deps chromium
          echo "CHROMIUM_PATH=$(find ~/.cache/ms-playwright -type f -name chrome -path '*chrome-linux*' | head -1)" >> "$GITHUB_ENV"
      - name: The journey suite
        run: npm test --workspace app
      - name: The drills
        run: |
          node ops/drill.mjs
          node ops/rehearsal.mjs

  # The image is how the stack actually reaches a host, so a broken
  # one is a broken deployment however green the suites are. Build it
  # and make it answer its own health door before calling it good.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the api image
        run: docker build -f infra/api.Dockerfile -t osyle-api:ci .
      - name: The image answers its own health door
        run: |
          docker run -d --name osyle-ci -e OSYLE_DATA=/data -p 8787:8787 osyle-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/health > /tmp/health.json; then break; fi
            sleep 1
          done
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok||!h.db||!h.blobs){console.error('the image is unwell');process.exit(1)}"
          docker rm -f osyle-ci
